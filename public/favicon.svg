<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     fill="none">

  <defs>
    <linearGradient id="fire" x1="256" y1="105" x2="256" y2="390"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffeda0"/>
      <stop offset=".48" stop-color="#feb24c"/>
      <stop offset="1" stop-color="#f03b20"/>
    </linearGradient>

    <linearGradient id="innerFire" x1="256" y1="215" x2="256" y2="365"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4bd"/>
      <stop offset="1" stop-color="#feb24c"/>
    </linearGradient>

    <filter id="glow" x="80" y="55" width="352" height="400"
            filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0b0b0d"/>

  <!-- Location marker -->
  <path d="M256 54
           C151 54 76 137 76 237
           C76 350 202 439 256 474
           C310 439 436 350 436 237
           C436 137 361 54 256 54Z"
        stroke="#feb24c"
        stroke-width="13"
        stroke-linejoin="round"
        opacity=".9"/>

  <!-- Subtle inner glow -->
  <path d="M256 120
           C224 166 167 205 167 278
           C167 338 206 382 256 382
           C306 382 345 338 345 278
           C345 205 288 166 256 120Z"
        fill="#f03b20"
        opacity=".22"
        filter="url(#glow)"/>

  <!-- Main flame -->
  <path d="M256 111
           C264 166 326 194 326 269
           C326 333 297 378 256 378
           C210 378 181 342 181 291
           C181 245 210 214 229 181
           C238 214 250 229 256 237
           C278 201 275 157 256 111Z"
        fill="url(#fire)"/>

  <!-- Inner flame -->
  <path d="M256 250
           C267 278 294 291 294 326
           C294 351 277 369 256 369
           C231 369 215 349 215 326
           C215 302 233 284 243 266
           C246 284 252 292 256 298
           C265 281 262 264 256 250Z"
        fill="url(#innerFire)"/>

  <!-- Hotspot centre -->
  <circle cx="256" cy="330" r="12" fill="#f03b20"/>

</svg>
